name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Generated data is never committed: the weekly data job (data.yml) builds the catalogue and both live in the
      # private Hugging Face dataset, so checks build the site from them without refetching TVmaze.
      - run: pnpm matches:pull && pnpm catalogue:pull
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - run: pnpm build
      # The automated half of the accessibility pass (docs/agents/frontend.md), against the site just built.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm a11y
